shutdown_costmaps: false
controller_frequency: 8.0
planner_frequency: 1.0
planner_patience: 5.0
controller_patience: 20.0
oscillation_timeout: 30.0
oscillation_distance: 0.05
recovery_behavior_enabled: true
clearing_rotation_allowed: false
max_planning_retries: 3
base_global_planner: zebrat/HybridAStarGlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
conservative_reset:
  reset_distance: 1.5
aggressive_reset:
  reset_distance: 3.0
HybridAStarGlobalPlanner:
  allow_unknown: true
  minimum_turning_radius: 0.98
  step_size: 0.20
  yaw_bins: 72
  max_iterations: 30000
  allow_reverse: true
  goal_xy_tolerance: 0.25
  goal_yaw_tolerance: 0.35
  analytic_expansion_max_length: 0.60
  reverse_penalty: 1.8
  direction_change_penalty: 1.5
  steering_change_penalty: 0.15
  lethal_cost: 253
  neutral_cost: 1.0
  cost_factor: 2.0
  footprint_padding: 0.01
  publish_plan: true
